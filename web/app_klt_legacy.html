<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MotionMuse · KLT 备用演奏台</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap");
    :root{--ink:#101512;--panel:#19211c;--line:#45564c;--text:#eef1e9;--muted:#abb8ae;--mint:#58d6b0;--amber:#f3ae4e;--danger:#ef715e}
    *{box-sizing:border-box} body{margin:0;min-height:100vh;background:radial-gradient(circle at 84% 12%,#253b30 0,transparent 28%),var(--ink);color:var(--text);font-family:"Noto Sans SC",sans-serif}
    .app{max-width:1440px;margin:auto;padding:26px}.topbar{display:flex;align-items:end;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:18px}.eyebrow,.mono{font:500 12px "IBM Plex Mono",monospace;letter-spacing:.11em}.eyebrow{color:var(--mint)}h1{margin:5px 0 0;font-size:clamp(24px,3vw,34px)}.top-status{color:var(--muted);text-align:right;line-height:1.7}
    .layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:22px;padding-top:22px}.stage{position:relative;min-height:600px;display:grid;place-items:center;background:#050806;border:1px solid var(--line);overflow:hidden;box-shadow:18px 18px 0 rgba(0,0,0,.2)}canvas{display:block;max-width:100%;max-height:74vh}.side{align-self:start;background:rgba(25,33,28,.92);border-top:3px solid var(--mint);padding:19px}.side h2{font-size:17px;margin:0 0 17px}.readout{border-bottom:1px solid #38463d;padding:12px 0}.readout span{display:block;color:var(--muted);font-size:12px}.readout b{font:500 18px "IBM Plex Mono",monospace}
    button,.file-label{display:block;width:100%;margin-top:10px;padding:12px;border:1px solid var(--line);background:transparent;color:var(--text);font:500 13px "IBM Plex Mono",monospace;text-align:left;cursor:pointer}.file-label{margin-top:0}button:hover,.file-label:hover{border-color:var(--mint);color:var(--mint)}button.primary{border-color:var(--mint);background:var(--mint);color:#102319}button.warn{border-color:var(--amber);color:var(--amber)}button:disabled{opacity:.4;cursor:not-allowed}.status{margin:18px 0 0;border-left:2px solid var(--line);padding-left:11px;color:var(--muted);font:12px/1.65 "IBM Plex Mono",monospace;min-height:58px}.hint{font-size:12px;color:var(--muted);line-height:1.7}
    .hud{position:absolute;left:20px;top:18px;pointer-events:none;text-shadow:0 2px 8px #000}.hud label{display:block;color:#c9d6cc;font:11px "IBM Plex Mono",monospace;letter-spacing:.1em}.chord{font:600 52px "IBM Plex Mono",monospace;color:var(--amber);line-height:1.1}.event{color:var(--mint);font:13px "IBM Plex Mono",monospace;margin-top:5px}.board-status{position:absolute;right:18px;bottom:16px;background:rgba(9,14,11,.78);padding:8px 11px;color:var(--mint);font:11px "IBM Plex Mono",monospace;pointer-events:none}
    .overlay{position:absolute;inset:0;display:none;place-items:center;background:rgba(5,8,6,.76);z-index:2}.overlay.show{display:grid}.overlay-card{max-width:430px;padding:28px;border:1px solid #64766a;background:#152019;text-align:center}.overlay-card h2{margin:0 0 8px;font-size:22px}.overlay-card p{color:var(--muted);font-size:14px;line-height:1.7}.overlay-card button{margin-top:18px;text-align:center}.corner-guide{display:flex;justify-content:center;gap:6px;margin:17px 0}.corner-guide i{width:16px;height:16px;border:2px solid var(--amber);display:block}.corner-guide i:nth-child(2){border-color:var(--mint)}.corner-guide i:nth-child(3){border-color:var(--mint)}
    @media(max-width:860px){.app{padding:16px}.layout{grid-template-columns:1fr}.stage{min-height:440px}.topbar{align-items:start;gap:12px;flex-direction:column}.top-status{text-align:left}}
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar"><div><div class="eyebrow">VISION INSTRUMENT / LIVE</div><h1>MotionMuse 幻奏</h1></div><div id="top-status" class="top-status mono">等待输入画面</div></header>
    <section class="layout">
      <div class="stage">
        <canvas id="canvas"></canvas>
        <div class="hud"><label>当前和弦</label><div id="chord" class="chord">—</div><div id="event" class="event">准备演奏</div></div>
        <div id="board-status" class="board-status">○ 未建立板子映射</div>
        <div id="overlay" class="overlay show"><div class="overlay-card"><div class="eyebrow">开始演奏</div><h2 id="overlay-title">选择输入画面</h2><p id="overlay-text">打开摄像头或上传一段本地视频。标定只会在开始演奏前出现一次。</p><div class="corner-guide"><i></i><i></i><i></i><i></i></div><button id="overlay-action" class="primary" disabled>开始标定</button></div></div>
      </div>
      <aside class="side">
        <h2>演奏控制台</h2>
        <div class="readout"><span>演奏状态</span><b id="mode-readout">IDLE</b></div>
        <div class="readout"><span>当前乐器</span><b>Air Guitar</b></div>
        <div class="readout"><span>视觉识别</span><b id="vision-readout">等待输入</b></div>
        <div style="margin-top:18px"><label class="file-label" for="file-input">上传本地视频</label><input id="file-input" type="file" accept="video/*" hidden><button id="camera">打开摄像头</button><button id="recalibrate" class="warn" disabled>重新标定板子</button><button id="download" disabled>导出板子配置</button></div>
        <p id="status" class="status">选择视频来源后即可开始演奏。</p><p class="hint">标定仅用于建立板子坐标系；演奏时主舞台会持续显示画面、手部骨架、和弦和扫弦反馈。</p>
      </aside>
    </section>
  </main>
  <video id="video" playsinline muted style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none"></video>
  <script src="./vendor/opencv-5.0.0.js"></script>
  <script>
    const MP_JS='https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs';
    const MP_WASM='https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm';
    const HAND_MODEL='https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task';
    const CONNECTIONS=[[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[0,17],[17,18],[18,19],[19,20]];
    const canvas=document.querySelector('#canvas'),ctx=canvas.getContext('2d'),video=document.querySelector('#video');
    const overlay=document.querySelector('#overlay'),overlayTitle=document.querySelector('#overlay-title'),overlayText=document.querySelector('#overlay-text'),overlayAction=document.querySelector('#overlay-action');
    const camera=document.querySelector('#camera'),fileInput=document.querySelector('#file-input'),recalibrate=document.querySelector('#recalibrate'),download=document.querySelector('#download');
    const status=document.querySelector('#status'),topStatus=document.querySelector('#top-status'),modeReadout=document.querySelector('#mode-readout'),visionReadout=document.querySelector('#vision-readout'),chordLabel=document.querySelector('#chord'),eventLabel=document.querySelector('#event'),boardStatus=document.querySelector('#board-status');
    let source='none',stream=null,objectUrl=null,frame=null,points=[],mode='idle',raf=0,handLandmarker=null,playing=false,width=0,height=0,currentChord='—',previousStrum=null,lastStrum=0;
    let boardTracker=null,boardAnchor=null;
    const setStatus=(text,error=false)=>{status.textContent=text;status.style.borderColor=error?'var(--danger)':'var(--line)'};
    const setMode=(next)=>{mode=next;modeReadout.textContent=next.toUpperCase();topStatus.textContent=next==='performing'?'演奏中 · 本地视觉推理':next==='calibrating'?'演奏前准备 · 标定板子':'等待输入画面';};
    function setOverlay(title,text,show=true){overlayTitle.textContent=title;overlayText.textContent=text;overlay.classList.toggle('show',show);}
    function drawVideo(){if(video.readyState<2)return false;width=video.videoWidth;height=video.videoHeight;if(canvas.width!==width||canvas.height!==height){canvas.width=width;canvas.height=height}ctx.drawImage(video,0,0,width,height);return true;}
    // canvas 不使用 object-fit；事件位置和实际像素栅格一一对应。
    function normalize(event){const rect=canvas.getBoundingClientRect();return{x:Math.max(0,Math.min(1,(event.clientX-rect.left)/rect.width)),y:Math.max(0,Math.min(1,(event.clientY-rect.top)/rect.height))};}
    function drawPoint(p,index){ctx.beginPath();ctx.arc(p.x*width,p.y*height,8,0,Math.PI*2);ctx.fillStyle=index<2?'#f3ae4e':'#58d6b0';ctx.fill();ctx.fillStyle='#fff';ctx.font='600 14px IBM Plex Mono';ctx.fillText(String(index+1),p.x*width+12,p.y*height-9)}
    function bilinear(u,v){const p=points;return{x:(1-u)*(1-v)*p[0].x+u*(1-v)*p[1].x+u*v*p[2].x+(1-u)*v*p[3].x,y:(1-u)*(1-v)*p[0].y+u*(1-v)*p[1].y+u*v*p[2].y+(1-u)*v*p[3].y};}
    // 演奏者面向摄像头时：右手吉他的琴颈在画面右侧，扫弦区在画面左侧。
    const CHORD_X0=.40,CHORD_X1=.96,STRUM_X0=.10,STRUM_X1=.32;
    function drawBoard(){if(!points.length)return;ctx.lineWidth=3;ctx.strokeStyle='#f3ae4e';ctx.beginPath();ctx.moveTo(points[0].x*width,points[0].y*height);points.slice(1).forEach(p=>ctx.lineTo(p.x*width,p.y*height));if(points.length===4)ctx.closePath();ctx.stroke();points.forEach(drawPoint);if(points.length!==4)return;for(let i=0;i<4;i++){const x0=CHORD_X0+i*.14,x1=x0+.14,q=[bilinear(x0,.2),bilinear(x1,.2),bilinear(x1,.8),bilinear(x0,.8)];ctx.beginPath();ctx.moveTo(q[0].x*width,q[0].y*height);q.slice(1).forEach(a=>ctx.lineTo(a.x*width,a.y*height));ctx.closePath();ctx.strokeStyle='#58d6b0';ctx.stroke();const c=bilinear((x0+x1)/2,.5);ctx.fillStyle='#58d6b0';ctx.font='600 16px IBM Plex Mono';ctx.fillText(['C','G','Am','F'][i],c.x*width-9,c.y*height+6)}const a=bilinear((STRUM_X0+STRUM_X1)/2,.15),b=bilinear((STRUM_X0+STRUM_X1)/2,.85);ctx.beginPath();ctx.moveTo(a.x*width,a.y*height);ctx.lineTo(b.x*width,b.y*height);ctx.strokeStyle='#f3ae4e';ctx.lineWidth=5;ctx.stroke()}
    function solve(m){const n=m.length;for(let c=0;c<n;c++){let p=c;for(let r=c+1;r<n;r++)if(Math.abs(m[r][c])>Math.abs(m[p][c]))p=r;[m[c],m[p]]=[m[p],m[c]];const d=m[c][c];if(Math.abs(d)<1e-9)return null;for(let j=c;j<=n;j++)m[c][j]/=d;for(let r=0;r<n;r++)if(r!==c){const f=m[r][c];for(let j=c;j<=n;j++)m[r][j]-=f*m[c][j]}}return m.map(x=>x[n])}
    function toBoard(p){if(points.length!==4)return null;const dst=[[0,0],[1,0],[1,1],[0,1]],m=[];points.forEach((c,i)=>{const [u,v]=dst[i],x=c.x,y=c.y;m.push([x,y,1,0,0,0,-u*x,-u*y,u],[0,0,0,x,y,1,-v*x,-v*y,v])});const h=solve(m);if(!h)return null;const d=h[6]*p.x+h[7]*p.y+1;return{x:(h[0]*p.x+h[1]*p.y+h[2])/d,y:(h[3]*p.x+h[4]*p.y+h[5])/d}}
    function drawHands(results){for(let i=0;i<results.landmarks.length;i++){const hand=results.landmarks[i],label=results.handedness[i][0].categoryName,color=label==='Left'?'#58d6b0':'#f3ae4e';ctx.strokeStyle=color;ctx.fillStyle=color;ctx.lineWidth=3;for(const[a,b]of CONNECTIONS){ctx.beginPath();ctx.moveTo(hand[a].x*width,hand[a].y*height);ctx.lineTo(hand[b].x*width,hand[b].y*height);ctx.stroke()}for(const p of hand){ctx.beginPath();ctx.arc(p.x*width,p.y*height,3.7,0,Math.PI*2);ctx.fill()}}}
    function interpret(results){let frettingHand,strummingHand;results.landmarks.forEach((hand,i)=>{const rawLabel=results.handedness[i][0].categoryName;// MediaPipe 按镜像自拍输入标注；本页画面未镜像，故角色需反向映射。
      if(rawLabel==='Right')frettingHand=hand;else strummingHand=hand});if(frettingHand){const p=toBoard(frettingHand[0]);if(p&&p.x>=CHORD_X0&&p.x<=CHORD_X1&&p.y>=.20&&p.y<=.80)currentChord=['C','G','Am','F'][Math.min(3,Math.floor((p.x-CHORD_X0)/.14))]}if(strummingHand){const p=toBoard(strummingHand[8]),now=performance.now();if(p&&previousStrum&&p.x>=STRUM_X0&&p.x<=STRUM_X1&&p.y>=.15&&p.y<=.85&&now-lastStrum>180){if(previousStrum.y<.5&&p.y>=.5){eventLabel.textContent='下扫弦';lastStrum=now}if(previousStrum.y>.5&&p.y<=.5){eventLabel.textContent='上扫弦';lastStrum=now}}previousStrum=p}else previousStrum=null;chordLabel.textContent=currentChord}
    async function ensureHand(){if(handLandmarker)return;const mod=await import(MP_JS),vision=mod.default||mod,resolver=await vision.FilesetResolver.forVisionTasks(MP_WASM);const opt={baseOptions:{modelAssetPath:HAND_MODEL,delegate:'GPU'},runningMode:'VIDEO',numHands:2,minHandDetectionConfidence:.55,minHandPresenceConfidence:.55,minTrackingConfidence:.55};try{handLandmarker=await vision.HandLandmarker.createFromOptions(resolver,opt)}catch(_){opt.baseOptions.delegate='CPU';handLandmarker=await vision.HandLandmarker.createFromOptions(resolver,opt)}}
    // ===== 本地 OpenCV 多特征点追踪：KLT 光流 + RANSAC 单应性 =====
    // 不独立追踪四个角；用板面所有稳定特征共同估计同一个透视变换。
    function waitForOpenCV(timeout=12000){return new Promise((resolve,reject)=>{const ready=()=>window.cv&&window.cv.Mat&&typeof window.cv.calcOpticalFlowPyrLK==='function';if(ready())return resolve();const started=performance.now(),check=()=>{if(ready())return resolve();if(performance.now()-started>timeout)return reject(new Error('本地 OpenCV.js 初始化超时'));requestAnimationFrame(check)};if(window.cv&&typeof window.cv.then==='function')window.cv.then(module=>{window.cv=module;check()},reject);else check()})}
    const releaseCvObjects=(holder)=>{if(holder)for(const item of Object.values(holder))if(item&&typeof item.delete==='function')item.delete();};
    // resetAnchor 仅在重新标定、切换视频源时使用；补点绝不能覆盖初始标定锚点。
    function deleteTracker(resetAnchor=false){releaseCvObjects(boardTracker);boardTracker=null;if(resetAnchor){releaseCvObjects(boardAnchor);boardAnchor=null;}}
    function pointMat(values){return cv.matFromArray(values.length/2,1,cv.CV_32FC2,values);}
    function captureGray(){const source=cv.imread(canvas),gray=new cv.Mat();cv.cvtColor(source,gray,cv.COLOR_RGBA2GRAY);source.delete();return gray;}
    function boardPolygon(){return points.flatMap(p=>[Math.round(p.x*width),Math.round(p.y*height)]);}
    function seedBoardTracker(gray=captureGray()){deleteTracker(false);const mask=cv.Mat.zeros(height,width,cv.CV_8UC1),polygon=cv.matFromArray(4,1,cv.CV_32SC2,boardPolygon()),detector=new cv.GFTTDetector(),features=new cv.KeyPointVector();cv.fillConvexPoly(mask,polygon,new cv.Scalar(255));detector.setMaxFeatures(180);detector.setQualityLevel(.008);detector.setMinDistance(7);detector.setBlockSize(5);detector.detect(gray,features,mask);const featureValues=[];for(let i=0;i<features.size();i++){const point=features.get(i).pt;featureValues.push(point.x,point.y)}if(featureValues.length<24){gray.delete();mask.delete();polygon.delete();detector.delete();features.delete();throw new Error('板面特征不足：请让板子正面清晰入镜后重新标定')}if(!boardAnchor){const orb=new cv.ORB(),keypoints=new cv.KeyPointVector(),descriptors=new cv.Mat();orb.setMaxFeatures(700);orb.detectAndCompute(gray,mask,keypoints,descriptors,false);if(keypoints.size()<12){gray.delete();mask.delete();polygon.delete();detector.delete();features.delete();orb.delete();keypoints.delete();descriptors.delete();throw new Error('板面 ORB 特征不足：请让板子正面清晰入镜后重新标定')}boardAnchor={corners:pointMat(points.flatMap(p=>[p.x*width,p.y*height])),keypoints,descriptors};orb.delete()}const corners=pointMat(points.flatMap(p=>[p.x*width,p.y*height])),trackedPoints=pointMat(featureValues);boardTracker={previousGray:gray,trackedPoints,corners,frames:0};mask.delete();polygon.delete();detector.delete();features.delete();}
    // 光流无法跨越较大位移时，用标定帧的 ORB 特征重新定位板子。
    function recoverBoard(gray){if(!boardAnchor){gray.delete();return false}const orb=new cv.ORB(),keypoints=new cv.KeyPointVector(),descriptors=new cv.Mat(),emptyMask=new cv.Mat(),matcher=new cv.BFMatcher(cv.NORM_HAMMING,true),matches=new cv.DMatchVector();orb.setMaxFeatures(900);orb.detectAndCompute(gray,emptyMask,keypoints,descriptors,false);matcher.match(boardAnchor.descriptors,descriptors,matches);const ranked=[];for(let i=0;i<matches.size();i++){const match=matches.get(i);if(match.distance<=52)ranked.push(match)}ranked.sort((a,b)=>a.distance-b.distance);const sourceValues=[],targetValues=[];for(const match of ranked.slice(0,120)){const source=boardAnchor.keypoints.get(match.queryIdx).pt,target=keypoints.get(match.trainIdx).pt;sourceValues.push(source.x,source.y);targetValues.push(target.x,target.y)}const cleanup=()=>{orb.delete();keypoints.delete();descriptors.delete();emptyMask.delete();matcher.delete();matches.delete()};if(sourceValues.length<24){cleanup();gray.delete();return false}const sourcePoints=pointMat(sourceValues),targetPoints=pointMat(targetValues),inliers=new cv.Mat(),homography=cv.findHomography(sourcePoints,targetPoints,cv.RANSAC,3,inliers);sourcePoints.delete();targetPoints.delete();let count=0;for(const flag of inliers.data)count+=flag?1:0;const ratio=count/(sourceValues.length/2);if(!homography||homography.empty()||count<12||ratio<.45){cleanup();gray.delete();inliers.delete();if(homography)homography.delete();return false}const transformed=new cv.Mat();cv.perspectiveTransform(boardAnchor.corners,transformed,homography);const d=transformed.data32F,candidate=[{x:d[0],y:d[1]},{x:d[2],y:d[3]},{x:d[4],y:d[5]},{x:d[6],y:d[7]}];inliers.delete();homography.delete();if(!validBoard(candidate)){transformed.delete();cleanup();gray.delete();return false}transformed.delete();cleanup();points=candidate.map(p=>({x:p.x/width,y:p.y/height}));seedBoardTracker(gray);return true;}
    function validBoard(next){if(next.length!==4)return false;const area=Math.abs(next.reduce((sum,p,i)=>{const q=next[(i+1)%4];return sum+p.x*q.y-q.x*p.y},0))/2;if(area<width*height*.012||area>width*height*.92)return false;let sign=0;for(let i=0;i<4;i++){const a=next[i],b=next[(i+1)%4],c=next[(i+2)%4],cross=(b.x-a.x)*(c.y-b.y)-(b.y-a.y)*(c.x-b.x);if(Math.abs(cross)<1)return false;if(sign&&cross*sign<0)return false;sign=cross}return next.every(p=>p.x>-width*.25&&p.x<width*1.25&&p.y>-height*.25&&p.y<height*1.25)}
    function updateBoardTracker(){if(!boardTracker)return false;let gray=captureGray();const needsGlobalCorrection=boardTracker.frames>0&&boardTracker.frames-(boardTracker.lastGlobalAttempt||0)>=30;if(needsGlobalCorrection){boardTracker.lastGlobalAttempt=boardTracker.frames;if(recoverBoard(gray))return true;gray=captureGray()}const next=new cv.Mat(),state=new cv.Mat(),error=new cv.Mat(),backward=new cv.Mat(),backState=new cv.Mat(),backError=new cv.Mat();cv.calcOpticalFlowPyrLK(boardTracker.previousGray,gray,boardTracker.trackedPoints,next,state,error,new cv.Size(41,41),4,new cv.TermCriteria(cv.TERM_CRITERIA_EPS|cv.TERM_CRITERIA_COUNT,30,.01));cv.calcOpticalFlowPyrLK(gray,boardTracker.previousGray,next,backward,backState,backError,new cv.Size(41,41),4,new cv.TermCriteria(cv.TERM_CRITERIA_EPS|cv.TERM_CRITERIA_COUNT,30,.01));const oldData=boardTracker.trackedPoints.data32F,newData=next.data32F,backData=backward.data32F,oldValues=[],newValues=[];for(let i=0;i<state.rows;i++){const dx=oldData[i*2]-backData[i*2],dy=oldData[i*2+1]-backData[i*2+1];if(state.data[i]&&backState.data[i]&&dx*dx+dy*dy<=6.25){oldValues.push(oldData[i*2],oldData[i*2+1]);newValues.push(newData[i*2],newData[i*2+1])}}next.delete();state.delete();error.delete();backward.delete();backState.delete();backError.delete();if(oldValues.length<24)return recoverBoard(gray);const oldPoints=pointMat(oldValues),newPoints=pointMat(newValues),inliers=new cv.Mat(),homography=cv.findHomography(oldPoints,newPoints,cv.RANSAC,3,inliers);oldPoints.delete();if(!homography||homography.empty()){newPoints.delete();inliers.delete();if(homography)homography.delete();return recoverBoard(gray)}const stableValues=[];let inlierCount=0;for(let i=0;i<inliers.data.length;i++)if(inliers.data[i]){stableValues.push(newValues[i*2],newValues[i*2+1]);inlierCount++}newPoints.delete();const inlierRatio=inlierCount/(oldValues.length/2);if(inlierCount<12||inlierRatio<.55){inliers.delete();homography.delete();return recoverBoard(gray)}const transformed=new cv.Mat();cv.perspectiveTransform(boardTracker.corners,transformed,homography);const d=transformed.data32F,candidate=[{x:d[0],y:d[1]},{x:d[2],y:d[3]},{x:d[4],y:d[5]},{x:d[6],y:d[7]}];if(!validBoard(candidate)){inliers.delete();homography.delete();transformed.delete();return recoverBoard(gray)}const stablePoints=pointMat(stableValues);boardTracker.previousGray.delete();boardTracker.trackedPoints.delete();boardTracker.corners.delete();boardTracker.previousGray=gray;boardTracker.trackedPoints=stablePoints;boardTracker.corners=transformed;boardTracker.frames++;points=candidate.map(p=>({x:p.x/width,y:p.y/height}));inliers.delete();homography.delete();return true;}
    async function beginPerformance(){try{await ensureHand();await video.play();drawVideo();await waitForOpenCV();seedBoardTracker()}catch(err){setStatus('手部或板子追踪初始化失败：'+(err.message||err),true);return}playing=true;setMode('performing');setOverlay('','',false);recalibrate.disabled=false;download.disabled=false;boardStatus.textContent='● 板子实时追踪中';visionReadout.textContent='双手与板子实时检测';const loop=()=>{if(!playing)return;if(drawVideo()){if(!updateBoardTracker()){playing=false;boardStatus.textContent='○ 板子追踪丢失，请重新标定';setStatus('板子追踪丢失：请点击“重新标定板子”。',true);return}boardStatus.textContent='● 板子实时追踪中';drawBoard();const result=handLandmarker.detectForVideo(video,performance.now());drawHands(result);interpret(result)}raf=requestAnimationFrame(loop);};loop()}
    function startCalibration(){if(video.readyState<2)return;deleteTracker(true);drawVideo();frame=document.createElement('canvas');frame.width=width;frame.height=height;frame.getContext('2d').drawImage(video,0,0,width,height);video.pause();playing=false;points=[];setMode('calibrating');setOverlay('标定普通板子','依次点击板子的左上、右上、右下、左下。完成后自动回到演奏。',false);setStatus('演奏前准备：请在主舞台中依次标定 4 个板角。');boardStatus.textContent='○ 等待板子四角';drawBoard()}
    async function openCamera(){stopSource();try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false});video.srcObject=stream;await video.play();source='camera';setMode('ready');overlayAction.disabled=false;setOverlay('准备演奏','将普通长方形板完整放入画面后，点击“开始标定”。');setStatus('摄像头已连接；标定完成后会自动进入演奏。');preview()}catch(err){setStatus('无法访问摄像头：'+err.name,true)}}
    function openFile(file){if(!file)return;stopSource();objectUrl=URL.createObjectURL(file);video.src=objectUrl;video.onloadeddata=async()=>{source='video';await video.play();setMode('ready');overlayAction.disabled=false;setOverlay('准备演奏','视频已载入。点击“开始标定”，在首帧标出普通板的四个角。');setStatus('视频已载入；标定完成后自动进入演奏。');preview()};video.onerror=()=>setStatus('无法读取此视频，请尝试 MP4/H.264。',true);video.load()}
    function preview(){const loop=()=>{if(mode==='ready'&&drawVideo()){}if(mode==='ready')raf=requestAnimationFrame(loop)};loop()}
    function stopSource(){cancelAnimationFrame(raf);playing=false;deleteTracker(true);if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;if(objectUrl)URL.revokeObjectURL(objectUrl);objectUrl=null;video.srcObject=null;video.removeAttribute('src')}
    canvas.addEventListener('click',e=>{if(mode!=='calibrating'||points.length>=4)return;points.push(normalize(e));ctx.drawImage(frame,0,0);drawBoard();if(points.length===4){setStatus('板子坐标系已建立，正在进入演奏模式。');void beginPerformance()}else setStatus(`已标记第 ${points.length} 个角；下一点：${['左上','右上','右下','左下'][points.length]}。`)});
    camera.onclick=openCamera;fileInput.onchange=e=>{openFile(e.target.files[0]);e.target.value=''};overlayAction.onclick=startCalibration;recalibrate.onclick=startCalibration;
    download.onclick=()=>{if(points.length!==4)return;const blob=new Blob([JSON.stringify({version:2,coordinate_system:'board_corners_tl_tr_br_bl',corners:points},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='board_calibration.json';a.click();URL.revokeObjectURL(url);setStatus('已导出 board_calibration.json。')};
  </script>
